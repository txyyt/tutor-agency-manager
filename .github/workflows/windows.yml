name: Windows CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check release version
        run: npm run release:check
      - name: Install Chromium
        run: npx playwright install chromium
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build web and server
        run: npm run build
      - name: Browser acceptance tests
        run: npm run test:e2e
      - name: Electron acceptance tests
        run: npm run test:desktop
      - name: Build Windows installer
        run: npm run dist:win
      - name: Test packaged executable
        run: |
          $env:DESKTOP_TEST_EXECUTABLE = (Resolve-Path 'release/win-unpacked/家教中介管理系统.exe').Path
          npm run test:desktop
      - name: Create portable ZIP and SHA256 manifest
        run: ./scripts/create-release-assets.ps1
      - name: Upload Windows downloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            release/TutorAgencyManager-Setup-*.exe
            release/TutorAgencyManager-Unpacked-*.zip
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-diagnostics-${{ github.sha }}
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/trace.zip
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish version release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64-${{ github.sha }}
          path: downloads
      - name: Publish installer and portable package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $assets = @(Get-ChildItem -LiteralPath downloads -File | Select-Object -ExpandProperty FullName)
          gh release view $env:RELEASE_TAG --repo $env:GH_REPO 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG @assets --clobber --repo $env:GH_REPO
          } else {
            gh release create $env:RELEASE_TAG @assets --verify-tag --generate-notes --title "家教中介管理系统 $env:RELEASE_TAG" --repo $env:GH_REPO
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
